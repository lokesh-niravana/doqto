name: doqto_app
description: "Doqto — secure doctor-to-doctor communication."
publish_to: 'none'
version: 1.0.0+25

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # HTTP + auth storage
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # Realtime
  web_socket_channel: ^2.4.0

  # Models + codegen
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Fonts + UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

  # Media
  record: ^5.1.2
  just_audio: ^0.9.36
  file_picker: ^10.3.3

  # Local cache
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.0
  get_it: ^7.6.7

  # Phone input (flag/code picker + E.164 validation)
  country_picker: ^2.0.26
  phone_numbers_parser: ^9.0.0

  # Image picker for profile avatar
  image_picker: ^1.0.7

  # Speech-to-text for live voice note transcription
  speech_to_text: ^7.0.0

  # Temp directory for voice recordings
  path_provider: ^2.1.2
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.2
  mime: ^2.0.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # Firebase brokers every sign-in method (see docs/auth.md). Apple rides
  # firebase_auth's OAuthProvider, so it needs no package of its own.
  firebase_auth: ^6.5.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - assets/splash_logo_white.png

flutter_launcher_icons:
  # Brand icon: white mark on brand teal (#35878F), matching AppColors.medBlue and the splash.
  image_path: "assets/icon/icon_fullbleed.png"
  android: true
  ios: true
  remove_alpha_ios: true # iOS icons must be opaque
  adaptive_icon_background: "#35878F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Workaround: record_linux 0.7.2 has a broken interface against
# record_platform_interface 1.5.0. We only target iOS + Android, so pin
# record_linux to a working version to unblock resolver.
dependency_overrides:
  record_linux: ^1.0.0
  # ITMS-90111 A/B test (build 12): path_provider_foundation 2.6.0 ships the
  # native-assets objective_c.framework (no dSYM, no Xcode toolchain stamps) —
  # the one embedded binary present in every rejected build. 2.5.1 predates
  # native assets and drops that framework entirely.
  path_provider_foundation: 2.5.1

